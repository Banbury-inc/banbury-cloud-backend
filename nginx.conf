server {
    listen 80;
    server_name _; # Listen on all hostnames

    # Health check endpoint
    location = /health/ {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    location / {
        proxy_pass http://127.0.0.1:8082; # Forward HTTP to Daphne
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8082; # Forward WebSocket to Daphne
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # Important for WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: If you have static files served by Django (NOT recommended for production)
    # location /static/ {
    #     alias /app/static/; # Adjust path as needed
    # }

    # Optional: If you have media files served by Django (NOT recommended for production)
    # location /media/ {
    #     alias /app/media/; # Adjust path as needed
    # }
} 
