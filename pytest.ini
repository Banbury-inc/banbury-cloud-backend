[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = test_*.py
asyncio_mode = auto
testpaths = apps websocket
markers =
    asyncio: mark a test as an asyncio coroutine
filterwarnings =
    ignore::DeprecationWarning
    ignore::django.utils.deprecation.RemovedInDjango50Warning 

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test output formatting
addopts = -v --cov=apps --cov=websocket --cov-report=term --cov-report=html

# Coverage configuration
[coverage:run]
source = apps,websocket
omit = */migrations/*, */tests/*, */test_*.py

[coverage:report]
# Skip coverage report for empty files
skip_empty = False
# Show line numbers of sources with missing coverage
show_missing = False
